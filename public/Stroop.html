<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>簡単ストループ試験</title>
        <style>
            body {
                font-family: "Helvetica Neue", Arial, sans-serif;
                background-color: #f0f2f5;
                margin: 0;
                padding: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                box-sizing: border-box;
            }
            .quiz-container {
                background-color: white;
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                padding: 24px;
                width: 100%;
                max-width: 400px;
                text-align: center;
            }
            h1 {
                font-size: 1.5rem;
                color: #333;
                margin-top: 0;
            }
            .progress {
                font-size: 0.9rem;
                color: #666;
                margin-bottom: 20px;
            }
            .instruction {
                font-size: 1.2rem;
                font-weight: bold;
                color: #d32f2f; /* 目立つように赤系に */
                background-color: #ffebee;
                padding: 8px;
                border-radius: 8px;
                margin-bottom: 15px;
            }
            .stroop-word {
                font-size: 3.5rem;
                font-weight: bold;
                margin: 25px 0;
                line-height: 1.2;
            }
            .options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 20px;
            }
            /* ボタンの色は惑わされないように一律グレーに統一 */
            .btn {
                padding: 15px;
                font-size: 1.2rem;
                font-weight: bold;
                border: 2px solid #ccc;
                border-radius: 8px;
                background-color: #f8f9fa;
                color: #333;
                cursor: pointer;
                transition: all 0.2s;
                -webkit-tap-highlight-color: transparent;
            }
            .btn:active {
                background-color: #e2e6ea;
            }
            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            /* 一問ずつの答え合わせ用フィードバック表示 */
            .feedback {
                margin-top: 20px;
                padding: 15px;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: bold;
                display: none;
            }
            .feedback.correct {
                display: block;
                background-color: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
            }
            .feedback.incorrect {
                display: block;
                background-color: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
            }
            .next-btn {
                margin-top: 20px;
                width: 100%;
                padding: 15px;
                font-size: 1.1rem;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 8px;
                font-weight: bold;
                display: none;
                cursor: pointer;
            }
            .result-screen {
                display: none;
            }
            .restart-btn {
                margin-top: 20px;
                padding: 12px 24px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="quiz-container">
            <div id="quiz-screen">
                <h1>ストループ試験</h1>
                <div class="progress" id="progress">第 1 問 / 5 問</div>
                <div class="instruction">インクの色を答えてください</div>

                <div class="stroop-word" id="stroop-word">あか</div>

                <div class="options-grid" id="options-grid"></div>

                <div class="feedback" id="feedback"></div>

                <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                    次の問題へ
                </button>
            </div>

            <div id="result-screen" class="result-screen">
                <h1>試験終了！</h1>
                <p style="font-size: 1.3rem; margin: 20px 0">
                    あなたのスコア:
                    <span id="score" style="font-weight: bold; color: #ff5722"
                        >0</span
                    >
                    / 5 問正解
                </p>
                <p id="result-comment"></p>
                <button class="restart-btn" onclick="restartQuiz()">
                    もう一度挑戦する
                </button>
            </div>
        </div>

        <script>
            // 問題データ (text: 表示文字, color: 正解のインクの色, colorCode: カラーコード)
            const questions = [
                { text: "あお", color: "あか", colorCode: "#ff0000" },
                { text: "みどり", color: "きいろ", colorCode: "#ffd700" },
                { text: "あか", color: "あお", colorCode: "#0000ff" },
                { text: "きいろ", color: "みどり", colorCode: "#008000" },
                { text: "あお", color: "みどり", colorCode: "#008000" },
            ];

            const choices = ["あか", "あお", "みどり", "きいろ"];
            let currentQuestionIndex = 0;
            let score = 0;

            function initQuiz() {
                currentQuestionIndex = 0;
                score = 0;
                document.getElementById("quiz-screen").style.display = "block";
                document.getElementById("result-screen").style.display = "none";
                showQuestion();
            }

            function showQuestion() {
                const currentQuestion = questions[currentQuestionIndex];

                // 進捗表示
                document.getElementById("progress").textContent =
                    `第 ${currentQuestionIndex + 1} 問 / ${questions.length} 問`;

                // 文字とインク色の設定
                const wordElement = document.getElementById("stroop-word");
                wordElement.textContent = currentQuestion.text;
                wordElement.style.color = currentQuestion.colorCode;

                // フィードバックと次へボタンを初期化（隠す）
                document.getElementById("feedback").className = "feedback";
                document.getElementById("feedback").style.display = "none";
                document.getElementById("next-btn").style.display = "none";

                // 選択肢ボタンの生成
                const optionsGrid = document.getElementById("options-grid");
                optionsGrid.innerHTML = "";

                choices.forEach((choice) => {
                    const button = document.createElement("button");
                    button.className = "btn";
                    button.textContent = choice;
                    button.onclick = () => checkAnswer(choice);
                    optionsGrid.appendChild(button);
                });
            }

            // ★一問ずつの答え合わせ処理
            function checkAnswer(selectedChoice) {
                const currentQuestion = questions[currentQuestionIndex];
                const feedbackElement = document.getElementById("feedback");

                // 二重タップ防止のため、すべての選択肢ボタンを無効化
                const buttons = document.querySelectorAll(".options-grid .btn");
                buttons.forEach((btn) => (btn.disabled = true));

                // その場で正誤判定を表示
                if (selectedChoice === currentQuestion.color) {
                    feedbackElement.innerHTML =
                        "正解！ ⭕️<br><span style='font-size:0.9rem; font-weight:normal;'>ナイス判断です！</span>";
                    feedbackElement.className = "feedback correct";
                    score++;
                } else {
                    feedbackElement.innerHTML = `残念！ ❌<br><span style='font-size:0.9rem; font-weight:normal;'>正解は「${currentQuestion.color}」です。（文字に釣られましたね！）</span>`;
                    feedbackElement.className = "feedback incorrect";
                }

                // 次の問題に進むためのボタンを表示
                document.getElementById("next-btn").style.display = "block";
            }

            function nextQuestion() {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }

            function showResult() {
                document.getElementById("quiz-screen").style.display = "none";
                document.getElementById("result-screen").style.display =
                    "block";
                document.getElementById("score").textContent = score;

                let comment = "";
                if (score === 5) {
                    comment = "素晴らしい！脳のコントロールが完璧です！";
                } else if (score >= 3) {
                    comment =
                        "お見事！ついつい文字を読みそうになるのを上手くこらえました。";
                } else {
                    comment =
                        "文字の意味に引っ張られてしまいましたね。もう一度挑戦してみましょう！";
                }
                document.getElementById("result-comment").textContent = comment;
            }

            function restartQuiz() {
                initQuiz();
            }

            // 初回起動
            initQuiz();
        </script>
    </body>
</html>
